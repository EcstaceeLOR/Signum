name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Verify canonical contract interface
        run: npm run contracts:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  chain-simulator:
    name: Chain simulator baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vendor/chain-casino-sdk/package-lock.json

      - name: Install Chain SDK dependencies
        run: npm run simulator:install

      - name: Build simulator and official Coinflip example
        run: npm run simulator:check

  simulator-e2e:
    name: Signum simulator lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Signum dependencies
        run: npm ci

      - name: Locate Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Run real simulator lifecycle
        run: npm run e2e:simulator

      - name: Upload browser and simulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signum-simulator-e2e-logs
          path: artifacts/e2e
          if-no-files-found: ignore
