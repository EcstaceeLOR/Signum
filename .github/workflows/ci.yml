name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:dependencies

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Verify exhaustive math report
        run: npm run math:check

      - name: Verify canonical contract interface
        run: npm run contracts:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Scan tracked files and production bundle for secrets
        run: npm run security:secrets

  chain-simulator:
    name: Chain simulator baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/chain-casino-sdk/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install Chain SDK dependencies
        run: npm run simulator:install

      - name: Build simulator and official Coinflip example
        run: npm run simulator:check

      - name: Install Chromium
        run: npm run playwright:install

      - name: Run Signum simulator lifecycle
        run: npm run test:e2e:simulator

      - name: Upload simulator failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: signum-simulator-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
